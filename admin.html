<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>Admin - Zeta Persei</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <div class="logo">Zeta Admin</div>
    <nav>
        <div class="menu"><button onclick="goPage('index.html')">사이트로 이동</button></div>
    </nav>
</header>
<main style="padding:120px 20px;">
    <h1>수신된 문의</h1>
    <div id="messagesWrap"></div>

    <section class="faq-admin-section">
        <h2>FAQ 고객 질문</h2>
        <div id="faqAdminWrap"></div>
    </section>
</main>
<script>
const FAQ_STORAGE_KEY = 'zeta_faq_questions';

function goPage(url){ window.location.href = url }

function requireAdminAuth() {
    const auth = localStorage.getItem("zeta_admin_auth");
    if (auth === "true") return;
    const code = prompt("관리자 번호 4자리를 입력해주세요.");
    if (code === null) {
        goPage('index.html');
        return;
    }
    const trimmed = code.trim();
    if (trimmed === "0904") {
        localStorage.setItem("zeta_admin_auth", "true");
        return;
    }
    alert("관리자 번호가 틀렸습니다.");
    goPage('index.html');
}

requireAdminAuth();

function formatDate(iso){ try { return new Date(iso).toLocaleString(); } catch(e){ return iso } }

function renderMessages(){
    const wrap = document.getElementById('messagesWrap');
    const messages = JSON.parse(localStorage.getItem('zeta_messages') || '[]');
    if(!messages.length){ wrap.innerHTML = '<p>메시지가 없습니다.</p>'; return; }
    wrap.innerHTML = messages.map((m, i) => `
        <section class="admin-message">
            <header>
                <strong>${m.name}</strong> — <small>${m.contact}</small>
                <div class="admin-actions">
                    <button data-i="${i}" class="mark-btn">${m.status === 'done' ? '완료 취소' : '완료'}</button>
                    <button data-i="${i}" class="del-btn">삭제</button>
                </div>
            </header>
            <p>${m.message}</p>
            ${m.attachment ? `<div class="admin-attachment">첨부: ${m.attachment.name} <br/> ${m.attachment.type.startsWith('image/') ? '<img src="'+m.attachment.data+'" style="max-width:240px"/>' : ''}</div>` : ''}
            <footer><small>${formatDate(m.receivedAt)} — 상태: ${m.status}</small></footer>
        </section>
    `).join('');

    // attach button handlers
    document.querySelectorAll('.del-btn').forEach(btn => btn.addEventListener('click', (e) => {
        const i = Number(e.target.dataset.i);
        messages.splice(i,1);
        localStorage.setItem('zeta_messages', JSON.stringify(messages));
        renderMessages();
    }));

    document.querySelectorAll('.mark-btn').forEach(btn => btn.addEventListener('click', (e) => {
        const i = Number(e.target.dataset.i);
        messages[i].status = messages[i].status === 'done' ? 'queued' : 'done';
        localStorage.setItem('zeta_messages', JSON.stringify(messages));
        renderMessages();
    }));
}

function escapeHtml(value) {
    return String(value ?? '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[char]));
}

function getFaqQuestions(){
    try {
        return JSON.parse(localStorage.getItem(FAQ_STORAGE_KEY) || '[]');
    } catch (e) {
        return [];
    }
}

function saveFaqQuestions(questions){
    localStorage.setItem(FAQ_STORAGE_KEY, JSON.stringify(questions));
}

function renderFaqQuestionsAdmin(){
    const wrap = document.getElementById('faqAdminWrap');
    const questions = getFaqQuestions().slice().reverse();

    if (!questions.length) {
        wrap.innerHTML = '<p>등록된 FAQ 질문이 없습니다.</p>';
        return;
    }

    wrap.innerHTML = questions.map((q) => `
        <section class="faq-admin-card ${q.status === 'answered' ? 'answered' : ''}">
            <header>
                <div>
                    <strong>${escapeHtml(q.name || '고객')}</strong>
                    <span class="faq-admin-company">업체명 : ${escapeHtml(q.company || '업체 미입력')}</span>
                </div>
                <div class="faq-admin-meta">
                    <small>${escapeHtml(q.contact || '연락처 없음')}</small>
                    <small>${formatDate(q.createdAt)}</small>
                </div>
            </header>
            <p class="faq-admin-question"><strong>질문:</strong> ${escapeHtml(q.question)}</p>
            <textarea data-id="${q.id}" class="faq-admin-answer" placeholder="답변을 입력해주세요.">${escapeHtml(q.answer || '')}</textarea>
            <div class="faq-admin-actions">
                <button data-id="${q.id}" class="faq-save-btn">답변 저장</button>
                <button data-id="${q.id}" class="faq-toggle-btn">${q.status === 'answered' ? '미답변 처리' : '답변 완료'}</button>
                <button data-id="${q.id}" class="faq-delete-btn">삭제</button>
            </div>
        </section>
    `).join('');

    document.querySelectorAll('.faq-save-btn').forEach((button) => {
        button.addEventListener('click', () => {
            const id = button.dataset.id;
            const target = document.querySelector(`.faq-admin-answer[data-id="${CSS.escape(id)}"]`);
            if (!target) return;
            const questions = getFaqQuestions();
            const item = questions.find((entry) => entry.id === id);
            if (!item) return;
            item.answer = target.value.trim();
            if (item.answer && item.status !== 'answered') item.status = 'answered';
            saveFaqQuestions(questions);
            renderFaqQuestionsAdmin();
        });
    });

    document.querySelectorAll('.faq-toggle-btn').forEach((button) => {
        button.addEventListener('click', () => {
            const id = button.dataset.id;
            const questions = getFaqQuestions();
            const item = questions.find((entry) => entry.id === id);
            if (!item) return;
            item.status = item.status === 'answered' ? 'pending' : 'answered';
            saveFaqQuestions(questions);
            renderFaqQuestionsAdmin();
        });
    });

    document.querySelectorAll('.faq-delete-btn').forEach((button) => {
        button.addEventListener('click', () => {
            const id = button.dataset.id;
            const questions = getFaqQuestions().filter((entry) => entry.id !== id);
            saveFaqQuestions(questions);
            renderFaqQuestionsAdmin();
        });
    });
}

renderMessages();
renderFaqQuestionsAdmin();
</script>
</body>
</html>
